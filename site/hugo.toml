# soundadam.com imports this directory as a Hugo module and renders it as
# /projects/pace/ (Chinese at /zh/projects/pace/). The page schema is
# www-src's .claude/rules/content-schema.md.
[module]
  [[module.mounts]]
    source = "content"
    target = "content/projects/pace"
  [[module.mounts]]
    source = "img"
    target = "assets/img/projects/pace"
