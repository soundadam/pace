# Continuous integration for soundprobe.
#
# Red line: CI never runs a real bandwidth measurement. `make test-offline`
# exercises fixtures and fake helpers only (see make/test.mk and
# scripts/test-*.sh); real measurements are an operator acceptance step
# documented in RELEASE.md and TESTING.md.
#
# Every gate below is offline or static. `make test-race` runs the same
# package set as `make test-offline`, only under the race detector, so it
# adds no new network behaviour. govulncheck is static analysis; the only
# thing it fetches is the Go vulnerability database.
#
# The check sequence itself is NOT defined here. `make ci-checks`
# (make/release.mk) is the single definition, and scripts/run-local-ci.sh runs
# the same target, so a local run cannot drift away from what CI enforces. Add
# or remove a check there, not in this file. The two jobs that are not part of
# that sequence say below why they are separate.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (make ci-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/test-release-artifact.sh creates git worktrees and tags;
          # it needs real history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        # Version pinned in make/common.mk, the same definition the local
        # `make test-vuln` reads. Nothing here names a version.
        run: make tools-vuln

      - name: make ci-checks
        # check-versions, fmt-check, verify-mod, test-offline, test-race,
        # component-check, test-cover, test-vuln, build.
        run: make ci-checks

  build:
    name: Build (${{ matrix.os }})
    # Not part of `ci-checks`: a cross-platform compile smoke test that
    # scripts/run-local-ci.sh (Linux amd64 only) cannot reproduce. Kept as
    # plain `go build` rather than make targets so it does not depend on GNU
    # make being present on the Windows runner image.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: Build soundprobe binary
        run: go build ./cmd/soundprobe

  lint:
    name: golangci-lint (report only)
    # Deliberately NOT a gate and deliberately not part of `ci-checks`.
    # golangci-lint is being introduced in report-only mode: the findings are
    # published for a human to triage, and nothing in the tree has been changed
    # to satisfy them. `make lint` always exits 0; continue-on-error is belt
    # and braces so a future tool crash cannot turn this into a blocker.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        # Version pinned in make/common.mk, same as the local `make lint`.
        run: make tools-lint

      - name: make lint
        run: make lint

      - name: make lint-strict
        # The broader set (revive, bodyclose, errorlint, nilerr, prealloc) that
        # is not in .golangci.yml, so the cost of a stricter configuration is
        # visible before anyone commits to it.
        run: make lint-strict
