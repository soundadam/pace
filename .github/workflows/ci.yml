# Continuous integration for pace.
#
# Red line: CI never runs a real bandwidth measurement. `make test-offline`
# exercises fixtures and fake helpers only (see make/test.mk and
# scripts/test-*.sh); real measurements are an operator acceptance step
# documented in RELEASE.md and TESTING.md.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        # components/ is vendored third-party source with its own module;
        # only the project's own packages must be gofmt-clean.
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Offline test suite
        run: make test-offline

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: Build pace binary
        run: go build ./cmd/pace

  # The branch ruleset requires this job alone. It passes when every job above
  # passed or was skipped, so adding a job here is the only change a new one needs.
  check:
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
