# Continuous integration for soundprobe.
#
# Red line: CI never runs a real bandwidth measurement. `make test-offline`
# exercises fixtures and fake helpers only (see make/test.mk and
# scripts/test-*.sh); real measurements are an operator acceptance step
# documented in RELEASE.md and TESTING.md.
#
# Every gate below is offline or static. `make test-race` runs the same
# package set as `make test-offline`, only under the race detector, so it
# adds no new network behaviour. govulncheck is static analysis; the only
# thing it fetches is the Go vulnerability database.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # Pinned for reproducible runs. The advisory database is still fetched at
  # run time, so results can change without this moving.
  GOVULNCHECK_VERSION: v1.8.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/test-release-artifact.sh creates git worktrees and tags;
          # it needs real history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        # components/ has its own module and is gated by the `component` job
        # below; this step covers the project's own packages.
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Go version pinning is consistent
        # go.mod is the single source of truth. Anything else that names a Go
        # version must agree with it, so the three pins cannot drift apart.
        run: |
          root="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          component="$(awk '$1 == "go" { print $2; exit }' components/librespeed-cli/go.mod)"
          local_ci="$(awk -F'"' '/^GO_ARCHIVE_PINNED_VERSION=/ { print $2; exit }' scripts/run-local-ci.sh)"
          echo "go.mod=$root component=$component run-local-ci.sh=$local_ci"
          if [ -z "$root" ] || [ "$component" != "$root" ] || [ "$local_ci" != "$root" ]; then
            echo "Go version pins disagree; go.mod is authoritative." >&2
            exit 1
          fi

      - name: Offline test suite
        run: make test-offline

      - name: Offline test suite (race detector)
        # Guards the goroutine fan-out in internal/target and the prepareMu
        # helper caching in internal/provider/{campus,mlab}. Previously only
        # reachable through scripts/run-local-ci.sh, so CI never ran it.
        run: make test-race

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - components/librespeed-cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: govulncheck (${{ matrix.module }})
        # Non-zero exit on any affecting vulnerability fails the build.
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  component:
    name: Component (librespeed-cli)
    # components/librespeed-cli is a nested module, so the root `go build ./...`
    # and `go vet ./...` do not reach it. Gate it explicitly.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/librespeed-cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: components/librespeed-cli/go.mod

      - name: gofmt
        # This is a locally-modified LGPL-3.0 derivative that will need future
        # rebases against upstream, but it is currently gofmt-clean, so hold
        # the line rather than letting drift in.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: Build soundprobe binary
        run: go build ./cmd/soundprobe
