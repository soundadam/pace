# GoReleaser v2 configuration for pace.
#
# Driven by .github/workflows/release.yml on every `v*` tag push. Local dry
# runs: `make release-check` (validate) and `make snapshot` (full build
# without publishing).
#
# Project red lines honored here:
#   - Nothing in this pipeline downloads or bundles third-party helper
#     binaries. The LibreSpeed helper (LGPL-3.0-only) and the ndt7 helper
#     (Apache-2.0) are separate programs; their licensing is called out in
#     the cask caveats and in THIRD_PARTY_NOTICES.md, which ships in every
#     archive.
#   - No step performs a real bandwidth measurement.
version: 2

project_name: pace

# pace itself (the only thing these archives contain) is MIT; the
# license is stated in the cask caveats below and in the bundled LICENSE.
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    # Matches the repo's `make verify-mod` habit; intentionally not
    # `go mod tidy`, which could mutate go.mod/go.sum during a release.
    - go mod verify

builds:
  - id: pace
    main: ./cmd/pace
    binary: pace
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Same injection points as internal/buildinfo/buildinfo.go and the
    # Homebrew template in packaging/homebrew/pace.rb.tmpl.
    # CommitDate (not build time) keeps binaries reproducible.
    ldflags:
      - -s
      - -w
      - -X github.com/soundadam/pace/internal/buildinfo.Version={{ .Version }}
      - -X github.com/soundadam/pace/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/soundadam/pace/internal/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))?!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^Merge "

release:
  # Assets are immutable once a Formula/Cask references their checksum.
  # Never replace an asset; ship a new version instead (see RELEASE.md).
  draft: false
  prerelease: auto

# Publishes a binary cask to the tap. `homebrew_casks` replaces the legacy
# `brews` section, which is fully deprecated since GoReleaser v2.16 and
# fails `goreleaser check`. Casks are Homebrew's supported way to ship
# pre-compiled binaries; the source-build Formula path remains available as
# the manual fallback (packaging/homebrew/, scripts/render-homebrew-formula.sh).
homebrew_casks:
  - name: pace
    repository:
      owner: soundadam
      name: homebrew-tap
      # Fine-grained PAT with contents write access to soundadam/homebrew-tap;
      # the workflow-provided GITHUB_TOKEN cannot push to another repository.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Casks must live in Casks/ (Homebrew requirement). The manual source
    # Formula, when published, lives in Formula/pace.rb.
    directory: Casks
    homepage: https://github.com/soundadam/pace
    description: Speed tests for proxies, campus intranets and CERNET
    # Do not push prerelease tags (e.g. v1.0.0-rc1) to the tap.
    skip_upload: auto
    caveats: |
      pace is MIT licensed.

      The optional measurement helpers are separate programs with their own
      licenses and are NOT bundled with this package:
        - librespeed-cli (LGPL-3.0-only)
        - ndt7-client (Apache-2.0)
      pace never downloads them automatically. Run `pace doctor`
      to see which helpers are available on this machine.
    hooks:
      post:
        # The binary is not signed/notarized; clear the quarantine bit so
        # Gatekeeper does not block it (see GoReleaser homebrew_casks docs).
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pace"]
          end
